<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - TURINGTECH Ecuador</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Barlow:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], barlow: ['Barlow', 'sans-serif'] },
          colors: {
            techDark: '#050C1F', techCard: 'rgba(11, 22, 49, 0.7)',
            accentOrange: '#FF6B00', accentOrangeHover: '#E05E00', brandNavyLight: '#111E3D'
          },
          boxShadow: { 'neon-orange': '0 0 20px rgba(255, 107, 0, 0.35)' }
        }
      }
    }
  </script>
</head>
<body class="text-gray-200 antialiased relative">

  <!-- Fondo dinámico -->
  <div class="bg-grid"></div>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
  <div class="fixed inset-0 overflow-hidden z-0">
    <canvas id="bg-canvas"></canvas>
    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-[#050C1F]/20 to-[#050C1F]/40 pointer-events-none"></div>
  </div>

  <!-- HEADER -->
  <div id="site-header"></div>

  <!-- LOGIN -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="/logo-turingtech-mark.svg" alt="TURINGTECH">
        <h1>TURING<span style="color:var(--color-accent)">TECH</span></h1>
        <p>Tu visión. <span style="color:var(--color-accent)">Nuestro código.</span></p>
      </div>
      <h2 class="auth-title" style="text-align: center; margin-bottom: 24px;">Iniciar Sesión</h2>
      <div id="alert-container"></div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email <span class="form-required-marker">*</span></label>
          <input type="email" id="email" class="form-input" placeholder="tu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Contraseña <span class="form-required-marker">*</span></label>
          <div class="pw-field">
            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Mostrar contraseña" title="Mostrar contraseña">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-large" id="submitBtn">
          <span id="btnText">Iniciar Sesión</span>
        </button>
      </form>
      <div class="auth-footer">
        ¿No tienes cuenta? <a href="/register.html">Regístrate aquí</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/background.js"></script>
  <script>

    if (API.isLoggedIn()) {
      API.getMe().then(() => {
        window.location.href = '/app.html';
      }).catch(() => {});
    }

    document.getElementById('pwToggle').addEventListener('click', function () {
      var input = document.getElementById('password');
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      this.querySelector('i').className = showing ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
      var label = showing ? 'Mostrar contraseña' : 'Ocultar contraseña';
      this.setAttribute('aria-label', label);
      this.setAttribute('title', label);
      input.focus();
    });
    async function handleLogin(event) {
      event.preventDefault();
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span>';
      try {
        await API.login(document.getElementById('email').value, document.getElementById('password').value);
        window.location.href = '/app.html';
      } catch (err) {
        showAlert(err.message, 'error');
        btn.disabled = false;
        btnText.textContent = 'Iniciar Sesión';
      }
    }
  </script>
  <script src="/js/site-header.js"></script>
</body>
</html>
