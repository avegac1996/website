<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - TURINGTECH Ecuador</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Barlow:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="logo-turingtech-nuevo.png" alt="TURINGTECH">
        <h1>TURINGTECH</h1>
        <p>Ecuador</p>
      </div>

      <h2 class="auth-title">Iniciar Sesión</h2>
      <p class="auth-subtitle">Ingresa a tu cuenta para gestionar tus créditos</p>

      <div id="alert-container"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email <span class="form-required-marker">*</span></label>
          <input type="email" id="email" class="form-input" placeholder="tu@email.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Contraseña <span class="form-required-marker">*</span></label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-large" id="submitBtn">
          <span id="btnText">Iniciar Sesión</span>
        </button>
      </form>

      <div class="auth-footer">
        ¿No tienes cuenta? <a href="/register.html">Regístrate aquí</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (API.isLoggedIn()) {
      API.getMe().then(data => {
        if (data.user.role === 'admin') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/dashboard.html';
        }
      }).catch(() => {});
    }

    async function handleLogin(event) {
      event.preventDefault();
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span>';

      try {
        const data = await API.login(email, password);
        if (data.user.role === 'admin') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/dashboard.html';
        }
      } catch (err) {
        showAlert(err.message, 'error');
        btn.disabled = false;
        btnText.textContent = 'Iniciar Sesión';
      }
    }
  </script>
</body>
</html>
