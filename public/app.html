    /* ===== Humanizador de texto ===== */
    var HUM = { version: 'v2', text: '', filename: '', docx_base64: null, result: null, stats: null, busy: false };

    function viewHumanizador() {
      humRender();
      return Promise.resolve();
    }

    function humRender() {
      el('view').innerHTML =
        '<div class="glass-panel" style="padding:24px;margin-bottom:18px;">' +
          '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;">' +
            '<span class="text-gray text-sm">Versión:</span>' +
            '<div class="tabs" style="margin:0;border:none;">' +
              '<button class="tab ' + (HUM.version === 'v1' ? 'active' : '') + '" data-hv="v1">v1 · Original</button>' +
              '<button class="tab ' + (HUM.version === 'v2' ? 'active' : '') + '" data-hv="v2">v2 · Mejorada</button>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;">' +
            '<input type="file" id="hm_file" accept=".txt,.md,.markdown,.text,.docx" style="display:none;">' +
            '<button class="btn btn-secondary btn-small" id="hm_pick"><i class="fa-solid fa-file-arrow-up"></i> Insertar archivo (.txt, .md, .docx)</button>' +
            '<span class="text-gray text-xs" id="hm_fname">' + (HUM.filename ? esc(HUM.filename) : 'o pega el texto abajo') + '</span>' +
          '</div>' +
          '<textarea id="hm_text" class="form-input" rows="9" placeholder="Pega aquí el texto a humanizar...">' + esc(HUM.text) + '</textarea>' +
          '<div style="margin-top:14px;display:flex;gap:10px;align-items:center;">' +
            '<button class="btn btn-primary" id="hm_run" ' + (HUM.busy ? 'disabled' : '') + '><i class="fa-solid fa-wand-magic-sparkles"></i> ' + (HUM.busy ? 'Procesando...' : 'Humanizar') + '</button>' +
            '<button class="btn btn-secondary btn-small" id="hm_clear">Limpiar</button>' +
          '</div>' +
          '<div id="hm_prog" class="hm-progress" style="display:none;">' +
            '<div class="hm-prog-bar"><div class="hm-prog-fill" id="hm_prog_fill"></div></div>' +
            '<div class="hm-prog-label"><span id="hm_prog_stage">Procesando…</span><span id="hm_prog_pct">0%</span></div>' +
          '</div>' +
        '</div>' +
        '<div id="hm_out"></div>';

      document.querySelectorAll('[data-hv]').forEach(function (b) {
        b.addEventListener('click', function () { HUM.version = this.getAttribute('data-hv'); humRender(); });
      });
      el('hm_pick').addEventListener('click', function () { el('hm_file').click(); });
      el('hm_text').addEventListener('input', function () { HUM.text = this.value; HUM.filename = ''; HUM.docx_base64 = null; });
      el('hm_clear').addEventListener('click', function () { HUM = { version: HUM.version, text: '', filename: '', docx_base64: null, result: null, stats: null, busy: false }; humRender(); });
      el('hm_file').addEventListener('change', function () {
        var f = this.files && this.files[0]; if (!f) return;
        HUM.filename = f.name;
        var isDocx = /\.docx$/i.test(f.name);
        var reader = new FileReader();
        reader.onload = function (ev) {
          if (isDocx) {
            var dataUrl = String(ev.target.result || '');
            HUM.docx_base64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
            HUM.text = '';
            el('hm_text').value = ''; el('hm_text').placeholder = '(.docx cargado: ' + f.name + ')';
          } else {
            HUM.text = ev.target.result; HUM.docx_base64 = null;
            el('hm_text').value = HUM.text;
          }
          el('hm_fname').textContent = f.name;
        };
        reader.onerror = function () { showAlert('No se pudo leer el archivo.', 'error'); };
        if (isDocx) reader.readAsDataURL(f); else reader.readAsText(f);
      });
      el('hm_run').addEventListener('click', humRun);
      if (HUM.result != null) humRenderOut();
    }

    function humRun() {
      if (!HUM.docx_base64 && !el('hm_text').value.trim()) { showAlert('Inserta un archivo o pega texto.', 'warning'); return; }
      HUM.text = el('hm_text').value;
      HUM.busy = true; HUM.result = null; humRender();

      var prog = el('hm_prog'), fill = el('hm_prog_fill'), stg = el('hm_prog_stage'), pct = el('hm_prog_pct');
      prog.style.display = 'block';
      var setProg = function (f, s) {
        var p = Math.round(f * 100);
        fill.style.width = p + '%'; pct.textContent = p + '%';
        if (s) stg.textContent = s;
      };
      setProg(0.02, 'Enviando…');

      fetch('/api/humanizer?stream=1', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API.token },
        body: JSON.stringify({ version: HUM.version, text: HUM.docx_base64 ? undefined : HUM.text, docx_base64: HUM.docx_base64 || undefined })
      }).then(function (resp) {
        if (!resp.ok || !resp.body || !resp.body.getReader) {
          return resp.json().then(function (j) {
            if (j.error) throw new Error(j.error);
            if (j.result != null) { HUM.result = j.result; HUM.stats = j.stats; setProg(1, 'Listo'); return; }
            throw new Error('Respuesta no válida');
          });
        }
        var reader = resp.body.getReader(), dec = new TextDecoder(), buf = '';
        function pump() {
          return reader.read().then(function (res) {
            if (res.value) buf += dec.decode(res.value, { stream: true });
            var lines = buf.split('\n'); buf = lines.pop();
            lines.forEach(function (ln) {
              if (!ln.trim()) return;
              var evt; try { evt = JSON.parse(ln); } catch (e) { return; }
              if (evt.error) throw new Error(evt.error);
              if (evt.done) { HUM.result = evt.result; HUM.stats = evt.stats; setProg(1, 'Listo'); }
              else if (typeof evt.progress === 'number') setProg(evt.progress, evt.stage);
            });
            if (res.done) return;
            return pump();
          });
        }
        return pump();
      }).then(function () {
        HUM.busy = false;
        setTimeout(function () { humRender(); }, 250);
      }).catch(function (err) {
        HUM.busy = false;
        showAlert(err.message, 'error');
        humRender();
      });
    }

          '<textarea class="form-input" id="hm_result" rows="16" readonly style="font-family:ui-monospace,monospace;font-size:12.5px;">' + esc(HUM.result) + '</textarea>' +

      });
    }

      // Asistente estilo AWS/Azure: 1) tipo de crédito  2) detalles  3) revisar y enviar

      function steps() {
        var labels = ['Tipo de crédito', 'Detalles de la solicitud', 'Revisar y enviar'];
        return '<div class="wizard-steps">' + labels.map(function (l, i) {
          var n = i + 1, cls = n === w.step ? 'active' : (n < w.step ? 'done' : '');
          return (i ? '<span class="wizard-step sep">/</span>' : '') +
            '<div class="wizard-step ' + cls + '"><span class="num">' + (n < w.step ? '<i class="fa-solid fa-check"></i>' : n) + '</span>' + l + '</div>';

            }).join('') + '</div>' +

            '</div></div>';

          html += '<div class="glass-panel" style="padding:24px;max-width:680px;">' +
            '<div class="text-gray text-sm mb-2">Servicio: <strong class="text-accent">' + esc(typeOf().name) + '</strong></div>' +
            '<div class="form-group"><label>¿Cuántos créditos necesitas? <span class="form-required-marker">*</span></label>' +
              '<div class="tier-grid">' + CREDIT_TIERS.map(function (t) {
                return '<button type="button" class="tier-card ' + (String(w.credits) === String(t.credits) ? 'selected' : '') + '" data-tier="' + t.credits + '">' +
                  '<div class="tier-credits">' + t.credits.toLocaleString() + '</div>' +
                  '<div class="tier-label">' + esc(t.label) + '</div>' +
                  '<div class="tier-desc">' + esc(t.desc) + '</div></button>';
              }).join('') + '</div>' +
              '<div class="text-gray text-xs" style="margin-top:8px;">El equipo ajusta el monto final al aprobar, según el alcance real del proyecto.</div></div>' +
            '<div class="form-group"><label>Nombre del proyecto / caso de uso <span class="form-required-marker">*</span></label>' +
              '<input type="text" id="w_project" class="form-input" placeholder="Automatización de conciliaciones bancarias" value="' + esc(w.project) + '"></div>' +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">' +
              '<div class="form-group"><label>Prioridad</label><select id="w_prio" class="form-input">' +
                PRIORIDADES.map(function (p) { return '<option ' + (w.prioridad === p ? 'selected' : '') + '>' + p + '</option>'; }).join('') + '</select></div>' +
              '<div class="form-group"><label>Inicio estimado</label><input type="date" id="w_inicio" class="form-input" value="' + esc(w.inicio) + '"></div>' +

              '<button class="btn btn-primary" id="w_next">Revisar <i class="fa-solid fa-arrow-right"></i></button>' +
            '</div></div>';
        } else {
          html += '<div class="glass-panel" style="padding:24px;max-width:640px;">' +
            '<div class="section-heading" style="text-align:left;margin-bottom:14px;">Revisa tu solicitud</div>' +
            '<div class="summary-box">' +
              row('Tipo de crédito', typeOf().name) +
              row('Créditos solicitados', parseInt(w.credits, 10).toLocaleString()) +
              row('Proyecto / caso de uso', w.project) +
              row('Prioridad', w.prioridad) +
              row('Inicio estimado', w.inicio || 'Sin definir') +
              row('Justificación', w.justificacion) +
            '</div>' +
            '<div style="display:flex;justify-content:space-between;margin-top:20px;">' +
              '<button class="btn btn-secondary" id="w_back"><i class="fa-solid fa-arrow-left"></i> Atrás</button>' +
              '<button class="btn btn-primary" id="w_submit"><i class="fa-solid fa-paper-plane"></i> Enviar solicitud</button>' +
            '</div></div>';

        el('view').innerHTML = html;
        wire();
      }

      function row(k, v) { return '<div class="sr"><span>' + esc(k) + '</span><span>' + esc(v) + '</span></div>'; }

      function collectStep2() {
        w.project = el('w_project').value.trim();
        w.prioridad = el('w_prio').value;
        w.inicio = el('w_inicio').value;
        w.justificacion = el('w_just').value.trim();
      }

      function wire() {
        var next = el('w_next'), back = el('w_back');
        document.querySelectorAll('[data-type]').forEach(function (b) {
          b.addEventListener('click', function () { w.typeId = this.getAttribute('data-type'); render(); });
        });
        document.querySelectorAll('[data-tier]').forEach(function (c) {
          c.addEventListener('click', function () {
            w.credits = this.getAttribute('data-tier');
            document.querySelectorAll('[data-tier]').forEach(function (n) { n.classList.remove('selected'); });
            this.classList.add('selected');
          });
        });
        if (back) back.addEventListener('click', function () { if (w.step === 2) collectStep2(); w.step--; render(); });
        if (next) next.addEventListener('click', function () {
          if (w.step === 1) { if (!w.typeId) return; w.step = 2; render(); return; }
          if (w.step === 2) {
            collectStep2();
            if (!w.credits || parseInt(w.credits, 10) < 200) return showAlert('Elige un paquete de créditos.', 'warning');
            if (!w.project) return showAlert('Indica el nombre del proyecto.', 'warning');
            if (!w.justificacion) return showAlert('Agrega una justificación.', 'warning');
            w.step = 3; render();
          }
        });
        var submit = el('w_submit');
        if (submit) submit.addEventListener('click', function () {
          submit.disabled = true; submit.textContent = 'Enviando...';
          var desc = '[' + typeOf().name + '] ' + w.project +
            ' — Prioridad: ' + w.prioridad +
            (w.inicio ? ' — Inicio estimado: ' + w.inicio : '') +
            '\n\n' + w.justificacion;
          API.requestCredits(desc, parseInt(w.credits, 10)).then(function () {
            showAlert('Tu solicitud será revisada en los próximos minutos.', 'success');
            location.hash = '#/solicitudes';
            return loadDashboard(true);
          }).catch(function (err) {
            showAlert(err.message, 'error');
            submit.disabled = false; submit.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar solicitud';
          });
        });
      }

      render();
      return Promise.resolve();
    }

          '</div>' +
          '<p class="text-gray text-xs mt-1">Los ' + (u.account_type === 'colaborador' ? 'Turingcoins' : 'créditos') + ' se ajustan en <strong>Administración → Modificar créditos</strong>.</p>' +
          '<button type="submit" class="btn btn-primary" id="eu_btn">Guardar cambios</button></form>' +
        '</div>';

      el('euBack').addEventListener('click', function () { viewAdminUsuarios(); });
      el('euForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = el('eu_btn'); btn.disabled = true; btn.textContent = 'Guardando...';
        if (el('eu_type').value === 'colaborador' && !el('eu_position').value.trim()) {
          showAlert('El cargo es obligatorio para colaboradores.', 'warning');
          btn.disabled = false; btn.textContent = 'Guardar cambios'; return;
        }
        var body = {
          name: el('eu_name').value.trim(), email: el('eu_email').value.trim(),
          role: el('eu_role').value, account_type: el('eu_type').value,
          position: el('eu_position').value.trim(),
          company: el('eu_company').value.trim(), phone: el('eu_phone').value.trim(),
          vacation_total: parseInt(el('eu_vt').value, 10) || 0,
          vacation_used: parseInt(el('eu_vu').value, 10) || 0
        };
        var pass = el('eu_pass').value;
        API.request('/api/admin/users/' + u.id, { method: 'PUT', body: JSON.stringify(body) })
          .then(function () {
            if (pass && pass.length >= 6) {
              return API.request('/api/admin/users/' + u.id + '/password', { method: 'PUT', body: JSON.stringify({ password: pass }) });
            }
          })
          .then(function () {
            showAlert('Usuario actualizado.', 'success');
            state.users = null; state.dashboard = null;
            viewAdminUsuarios();
          })
          .catch(function (err) { showAlert(err.message, 'error'); btn.disabled = false; btn.textContent = 'Guardar cambios'; });
      });
    }

    function viewAdminUsuarios() {
      return loadUsers(true).then(function (users) {
        var staff = users.filter(isTuringtech);
        var clients = users.filter(function (u) { return !isTuringtech(u); });
        var block = function (title, icon, arr) {
          return '<div class="glass-panel" style="padding:24px;margin-bottom:22px;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
            '<h2 style="color:#fff;font-size:18px;font-weight:700;"><i class="fa-solid ' + icon + '" style="color:var(--color-accent);margin-right:8px;"></i>' + title + '</h2>' +
            '<span class="badge badge-secondary">' + arr.length + '</span></div>' +
            '<div style="display:flex;flex-direction:column;gap:10px;">' +
            (arr.map(userCard).join('') || '<p class="text-gray text-center" style="padding:24px 0;">Sin usuarios.</p>') + '</div></div>';
        };

        var form =
          '<div class="glass-panel" style="padding:24px;margin-bottom:22px;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;">' +
              '<h2 style="color:#fff;font-size:18px;font-weight:700;"><i class="fa-solid fa-user-plus" style="color:var(--color-accent);margin-right:8px;"></i>Crear usuario</h2>' +
              '<button class="btn btn-secondary btn-small" id="nuToggle">Nuevo usuario</button>' +
            '</div>' +
            '<form id="nuForm" style="display:none;margin-top:18px;">' +
              '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">' +
                '<div class="form-group"><label>Nombre <span class="form-required-marker">*</span></label><input type="text" id="nu_name" class="form-input" required></div>' +
                '<div class="form-group"><label>Email <span class="form-required-marker">*</span></label><input type="email" id="nu_email" class="form-input" placeholder="nombre@turingtech.com.ec" required></div>' +
                '<div class="form-group"><label>Contraseña <span class="form-required-marker">*</span></label><input type="text" id="nu_pass" class="form-input" placeholder="mín. 6 caracteres" required minlength="6"></div>' +
                '<div class="form-group"><label>Tipo de cuenta <span class="form-required-marker">*</span></label><select id="nu_type" class="form-input">' +
                  '<option value="cliente">Cliente (portal de créditos)</option>' +
                  '<option value="colaborador">Colaborador TURINGTECH (portal RRHH)</option>' +
                '</select></div>' +
                '<div class="form-group"><label>Rol <span class="form-required-marker">*</span></label><select id="nu_role" class="form-input">' +
                  '<option value="user">Usuario</option>' +
                  '<option value="admin">Administrador (panel completo)</option>' +
                '</select></div>' +
                '<div class="form-group" id="nu_position_g"><label>Cargo <span class="form-required-marker" id="nu_pos_req" style="display:none;">*</span></label><input type="text" id="nu_position" class="form-input" placeholder="Data Engineer, Contadora..."></div>' +
                '<div class="form-group"><label>Empresa</label><input type="text" id="nu_company" class="form-input" value="TURINGTECH Ecuador"></div>' +
                '<div class="form-group"><label>Teléfono</label><input type="tel" id="nu_phone" class="form-input"></div>' +
                '<div class="form-group"><label>Saldo inicial (créditos / Turingcoins)</label><input type="number" id="nu_credits" class="form-input" value="0" min="0"></div>' +
                '<div class="form-group nu-col" style="display:none;"><label>Días de vacaciones (total)</label><input type="number" id="nu_vt" class="form-input" value="10" min="0"></div>' +
                '<div class="form-group nu-col" style="display:none;"><label>Vacaciones gozadas</label><input type="number" id="nu_vu" class="form-input" value="0" min="0"></div>' +
              '</div>' +
              '<button type="submit" class="btn btn-primary" id="nu_btn"><i class="fa-solid fa-check"></i> Crear usuario</button>' +
            '</form>' +
          '</div>';

        el('view').innerHTML = form + block('Clientes', 'fa-briefcase', clients) + block('Usuarios TURINGTECH', 'fa-shield-halved', staff);

        wireUserActions();

        var nuSync = function () {
          var col = el('nu_type').value === 'colaborador';
          el('nu_pos_req').style.display = col ? 'inline' : 'none';
          document.querySelectorAll('.nu-col').forEach(function (n) { n.style.display = col ? 'block' : 'none'; });
        };
        el('nu_type').addEventListener('change', nuSync); nuSync();

        el('nuToggle').addEventListener('click', function () {
          var f = el('nuForm');
          f.style.display = f.style.display === 'none' ? 'block' : 'none';
        });
        el('nuForm').addEventListener('submit', function (e) {
          e.preventDefault();
          if (el('nu_type').value === 'colaborador' && !el('nu_position').value.trim()) {
            showAlert('El cargo es obligatorio para colaboradores.', 'warning'); return;
          }
          var btn = el('nu_btn'); btn.disabled = true; btn.textContent = 'Creando...';
          API.request('/api/admin/users', {
            method: 'POST',
            body: JSON.stringify({
              name: el('nu_name').value.trim(),
              email: el('nu_email').value.trim(),
              password: el('nu_pass').value,
              role: el('nu_role').value,
              account_type: el('nu_type').value,
              position: el('nu_position').value.trim(),
              company: el('nu_company').value.trim(),
              phone: el('nu_phone').value.trim(),
              credits: parseInt(el('nu_credits').value, 10) || 0,
              vacation_total: parseInt(el('nu_vt').value, 10) || 0,
              vacation_used: parseInt(el('nu_vu').value, 10) || 0
            })
          }).then(function () {
            showAlert('Usuario creado.', 'success');
            state.users = null;
            viewAdminUsuarios();
          }).catch(function (err) {
            showAlert(err.message, 'error');
            btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-check"></i> Crear usuario';
          });
        });
      });
    }

    function viewAdminCreditos() {
      return loadUsers().then(function (users) {
        var opts = users.map(function (u) { return '<option value="' + u.id + '">' + esc(u.name) + ' — ' + esc(u.email) + ' (' + (u.credits || 0).toLocaleString() + ')</option>'; }).join('');
        el('view').innerHTML = '<div class="glass-panel" style="padding:28px;max-width:520px;"><form id="mcForm">' +
          '<div class="form-group"><label>Usuario <span class="form-required-marker">*</span></label><select id="mc_user" class="form-input" required>' + opts + '</select></div>' +
          '<div class="form-group"><label>Cantidad (positivo o negativo) <span class="form-required-marker">*</span></label><input type="number" id="mc_amount" class="form-input" placeholder="500" required></div>' +
          '<div class="form-group"><label>Motivo <span class="form-required-marker">*</span></label><input type="text" id="mc_reason" class="form-input" placeholder="Bonificación por proyecto" required></div>' +
          '<button type="submit" class="btn btn-primary btn-block" id="mc_btn">Aplicar</button></form></div>';
        el('mcForm').addEventListener('submit', function (e) {
          e.preventDefault();
          var btn = el('mc_btn'); btn.disabled = true; btn.textContent = 'Aplicando...';
          API.adjustUserCredits(el('mc_user').value, parseInt(el('mc_amount').value, 10), el('mc_reason').value).then(function () {
            showAlert('Créditos actualizados.', 'success'); state.users = null; state.dashboard = null; refreshBell(); location.hash = '#/admin-usuarios';
          }).catch(function (err) { showAlert(err.message, 'error'); })
            .then(function () { btn.disabled = false; btn.textContent = 'Aplicar'; });
        });
      });
    }

    function viewAdminConfig() {
      return API.getAdminConfig().then(function (r) {
        var cfg = r.config || r || {};
        var me = state.me;
        el('view').innerHTML =
          '<div class="glass-panel" style="padding:28px;max-width:520px;margin-bottom:22px;">' +
            '<div class="section-heading" style="text-align:left;margin-bottom:16px;">Mi foto</div>' +
            '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;">' +
              '<div id="cfgPhoto" style="width:76px;height:76px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--color-accent),var(--color-accent-hover));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:24px;">' + avatarHtml(me.name, me.photo) + '</div>' +
              '<div><input type="file" id="cfg_file" accept="image/png,image/jpeg,image/webp" style="display:none;">' +
                '<button class="btn btn-secondary btn-small" id="cfg_pick"><i class="fa-solid fa-upload"></i> Subir foto</button> ' +
                (me.photo ? '<button class="btn btn-error btn-small" id="cfg_rmphoto">Quitar</button>' : '') +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="glass-panel" style="padding:28px;max-width:520px;margin-bottom:22px;">' +
            '<div class="section-heading" style="text-align:left;margin-bottom:16px;">Email de notificaciones</div>' +
            '<form id="cfgForm">' +
              '<div class="form-group"><label>Email <span class="form-required-marker">*</span></label>' +
              '<input type="email" id="cfg_email" class="form-input" value="' + esc(cfg.notification_email || '') + '" required></div>' +
              '<p class="text-gray text-sm mb-2">Las solicitudes de créditos se enviarán a este correo.</p>' +
              '<button type="submit" class="btn btn-primary" id="cfg_btn">Guardar</button>' +
            '</form>' +
          '</div>' +
          '<div class="glass-panel" style="padding:28px;max-width:520px;">' +
            '<div class="section-heading" style="text-align:left;margin-bottom:16px;">Cambiar mi contraseña</div>' +
            '<form id="pwForm">' +
              '<div class="form-group"><label>Contraseña actual <span class="form-required-marker">*</span></label>' +
              '<input type="password" id="pw_cur" class="form-input" required autocomplete="current-password"></div>' +
              '<div class="form-group"><label>Nueva contraseña <span class="form-required-marker">*</span></label>' +
              '<input type="password" id="pw_new" class="form-input" required minlength="6" autocomplete="new-password"></div>' +
              '<div class="form-group"><label>Repetir nueva contraseña <span class="form-required-marker">*</span></label>' +
              '<input type="password" id="pw_new2" class="form-input" required minlength="6" autocomplete="new-password"></div>' +
              '<button type="submit" class="btn btn-primary" id="pw_btn">Actualizar contraseña</button>' +
            '</form>' +
          '</div>';

        function savePhoto(dataUrl) {
          return API.request('/api/hr/profile', { method: 'POST', body: JSON.stringify({ photo: dataUrl }) })
            .then(function () { state.me.photo = dataUrl || null; paintTopbarAvatar(); showAlert(dataUrl ? 'Foto actualizada.' : 'Foto quitada.', 'success'); viewAdminConfig(); })
            .catch(function (e) { showAlert(e.message, 'error'); });
        }
        el('cfg_pick').addEventListener('click', function () { el('cfg_file').click(); });
        el('cfg_file').addEventListener('change', function () {
          var f = this.files && this.files[0]; if (!f) return;
          var reader = new FileReader();
          reader.onload = function (ev) {
            var img = new Image();
            img.onload = function () {
              var size = 256, c = document.createElement('canvas'); c.width = size; c.height = size;
              var ctx = c.getContext('2d'), s = Math.min(img.width, img.height);
              ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
              savePhoto(c.toDataURL('image/jpeg', 0.85));
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(f);
        });
        var rmp = el('cfg_rmphoto');
        if (rmp) rmp.addEventListener('click', function () { savePhoto(''); });

        el('cfgForm').addEventListener('submit', function (e) {
          e.preventDefault();
          var btn = el('cfg_btn'); btn.disabled = true; btn.textContent = 'Guardando...';
          API.updateAdminConfig('notification_email', el('cfg_email').value).then(function () {
            showAlert('Configuración guardada.', 'success');
          }).catch(function (err) { showAlert(err.message, 'error'); })
            .then(function () { btn.disabled = false; btn.textContent = 'Guardar'; });
        });

        el('pwForm').addEventListener('submit', function (e) {
          e.preventDefault();
          if (el('pw_new').value !== el('pw_new2').value) { showAlert('Las contraseñas nuevas no coinciden.', 'warning'); return; }
          var btn = el('pw_btn'); btn.disabled = true; btn.textContent = 'Actualizando...';
          API.request('/api/auth/change-password', {
            method: 'POST',
            body: JSON.stringify({ current_password: el('pw_cur').value, new_password: el('pw_new').value })
          }).then(function () {
            showAlert('Contraseña actualizada.', 'success');
            el('pwForm').reset();
          }).catch(function (err) { showAlert(err.message, 'error'); })
            .then(function () { btn.disabled = false; btn.textContent = 'Actualizar contraseña'; });
        });
      });
    }

    /* ---------- Interacciones del shell ---------- */
    el('navToggle').addEventListener('click', function () {
      var shell = el('shell');
      if (window.matchMedia('(max-width: 1024px)').matches) shell.classList.toggle('nav-open');
      else shell.classList.toggle('collapsed');
    });
    el('navBackdrop').addEventListener('click', function () { el('shell').classList.remove('nav-open'); });
    // Al cruzar el breakpoint, limpiar estados de menú que no aplican
    var _wasMobile = window.matchMedia('(max-width: 1024px)').matches;
    window.addEventListener('resize', function () {
      var isMobile = window.matchMedia('(max-width: 1024px)').matches;
      if (isMobile !== _wasMobile) {
        el('shell').classList.remove('nav-open');
        if (isMobile) el('shell').classList.remove('collapsed');
        _wasMobile = isMobile;
      }
      el('userMenu').classList.remove('show');
    });
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { el('shell').classList.remove('nav-open'); el('userMenu').classList.remove('show'); }
    });
    el('bell').addEventListener('click', function () { location.hash = '#/notificaciones'; });
    el('userChip').addEventListener('click', function (e) {
      if (e.target.closest('#userMenu')) return;
      el('userMenu').classList.toggle('show');
    });
    document.addEventListener('click', function (e) {
      if (!e.target.closest('#userChip')) el('userMenu').classList.remove('show');
    });
    el('logoutLink').addEventListener('click', function (e) { e.preventDefault(); API.logout(); });
    el('navSearch').addEventListener('input', function () {
      var q = this.value.toLowerCase().trim();
      document.querySelectorAll('.nav-item').forEach(function (it) {
        it.style.display = (!q || it.textContent.toLowerCase().indexOf(q) !== -1) ? '' : 'none';
      });
    });
    window.addEventListener('hashchange', router);

    /* ---------- Init ---------- */
    API.getMe().then(function (data) {
      state.me = data.user;
      state.menu = buildMenu();
      el('userChipName').textContent = data.user.name;
      el('userChipRole').textContent = data.user.role === 'admin'
        ? 'Administrador TURINGTECH'
        : (data.user.account_type === 'colaborador' ? (data.user.position || 'Colaborador TURINGTECH') : 'Cliente');
      paintTopbarAvatar();
      buildSidebar();
      if (!location.hash || location.hash === '#') location.hash = '#/inicio';
      router();
      refreshBell();
      setInterval(refreshBell, 60000);
    }).catch(function () { window.location.href = '/login.html'; });
  })();
  </script>
</body>
</html>
