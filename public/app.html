<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi espacio - TURINGTECH Ecuador</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Barlow:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app-shell.css">
  <link rel="stylesheet" href="/css/board-kanban.css">
  <link rel="stylesheet" href="/css/board-sprint.css">
  <link rel="stylesheet" href="/css/board-gantt.css">
  <link rel="stylesheet" href="/css/humanizer.css">
  <link rel="stylesheet" href="/css/prospectos-crm.css">
  <link rel="stylesheet" href="/css/admin-catalogo.css">
  <link rel="stylesheet" href="/css/timbrado.css">
  <link rel="stylesheet" href="/css/admin-resumen.css">
</head>
<body class="antialiased">

  <div class="bg-grid"></div>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <div class="shell" id="shell">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <a href="/" class="sidebar-brand">
        <img src="/logo-turingtech-mark.svg" alt="TURINGTECH">
        <div>
          <span class="brand">TURING<span style="color:var(--color-accent)">TECH</span></span>
          <span class="subbrand">Tu visión. <span style="color:var(--color-accent)">Nuestro código.</span></span>
        </div>
      </a>
      <div class="sidebar-search">
        <input type="text" id="navSearch" placeholder="Buscar ...">
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>
    <div class="sidebar-backdrop" id="navBackdrop"></div>

    <!-- MAIN -->
    <div class="main">
      <header class="topbar">
        <button class="topbar-toggle" id="navToggle" aria-label="Menú"><i class="fa-solid fa-bars"></i></button>
        <div class="topbar-spacer"></div>
        <div class="topbar-bell" id="bell" title="Notificaciones">
          <i class="fa-solid fa-bell"></i>
          <span class="dot" id="bellDot" style="display:none;">0</span>
        </div>
        <div class="topbar-user" id="userChip">
          <div class="avatar" id="userAvatar">--</div>
          <div>
            <div class="u-name" id="userChipName">...</div>
            <div class="u-role" id="userChipRole"></div>
          </div>
          <i class="fa-solid fa-chevron-down" style="font-size:11px;color:var(--color-gray);"></i>
          <div class="user-menu" id="userMenu">
            <a href="/"><i class="fa-solid fa-globe"></i> Ir al sitio</a>
            <a href="#" id="logoutLink"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</a>
          </div>
        </div>
      </header>

      <div class="content">
        <div class="breadcrumb" id="breadcrumb"></div>
        <h1 class="page-title" id="pageTitle">Mi espacio</h1>
        <div id="alert-container"></div>
        <div id="view"><div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:24px 0;"><span class="spinner"></span></div></div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/prospectos-data.js"></script>
  <script type="module" src="/js/app-modules/main.js"></script>
</body>
</html>
