    <style>

        .bg-orb-2 {
            width: 400px;
            height: 400px;

            left: -100px;
            animation: orbFloat2 25s ease-in-out infinite;

        .bg-orb-3 {
            width: 350px;
            height: 350px;

            left: 50%;

            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-60px, 80px) scale(1.1); }
            66% { transform: translate(40px, -40px) scale(0.95); }
        }
        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(80px, -60px) scale(1.15); }
            66% { transform: translate(-30px, 40px) scale(0.9); }

    <script>
        // Variables globales
        let currentSpread = 0;
        let totalSpreads = 0;
        let pages = [];
        let spreads = [];
        let isDesktop = window.innerWidth > 1200;

        // Inicializar el catálogo
        function init() {
            // Obtener todas las páginas del template
            const template = document.getElementById('pages-template');
            pages = Array.from(template.content.querySelectorAll('.page'));
            
            // Crear spreads (agrupaciones de páginas)
            createSpreads();
            
            // Renderizar el primer spread
            renderSpread(0);
            
            // Update navigation
            updateNavigation();
        }

        function createSpreads() {
            const bookWrapper = document.getElementById('bookWrapper');
            bookWrapper.innerHTML = '';
            spreads = [];
            isDesktop = window.innerWidth > 1200;

            if (isDesktop) {
                // En desktop: portada sola, pares de páginas, contraportada sola
                // Spread 1: Portada (página 1)
                spreads.push([pages[0].cloneNode(true)]);
                
                // Spreads 2-3: Páginas 2-3, 4-5
                for (let i = 1; i < pages.length - 1; i += 2) {
                    const leftPage = pages[i].cloneNode(true);
                    const rightPage = pages[i + 1] ? pages[i + 1].cloneNode(true) : null;
                    
                    leftPage.classList.add('left-page');
                    leftPage.classList.remove('single-page');
                    
                    if (rightPage) {
                        rightPage.classList.add('right-page');
                        rightPage.classList.remove('single-page');
                        spreads.push([leftPage, rightPage]);
                    } else {
                        spreads.push([leftPage]);
                    }
                }
                
                // Última página (contraportada) sola si no está ya incluida
                const lastPage = pages[pages.length - 1];
                if (!spreads[spreads.length - 1].some(p => p.dataset.page === lastPage.dataset.page)) {
                    spreads.push([lastPage.cloneNode(true)]);
                }
            } else {
                // En móvil/tablet: una página por spread
                pages.forEach(page => {
                    const clonedPage = page.cloneNode(true);
                    clonedPage.classList.add('single-page');
                    clonedPage.classList.remove('left-page', 'right-page');
                    spreads.push([clonedPage]);
                });
            }

            totalSpreads = spreads.length;
            document.getElementById('totalPages').textContent = pages.length;
        }

        function renderSpread(spreadIndex) {
            const bookWrapper = document.getElementById('bookWrapper');
            
            // Remover todos los spreads activos
            const allSpreads = bookWrapper.querySelectorAll('.book-spread');
            allSpreads.forEach(spread => {
                spread.classList.remove('active');
                setTimeout(() => spread.remove(), 500);
            });

            // Crear nuevo spread
            const spreadDiv = document.createElement('div');
            spreadDiv.className = 'book-spread';
            
            spreads[spreadIndex].forEach(page => {
                spreadDiv.appendChild(page.cloneNode(true));
            });

            bookWrapper.appendChild(spreadDiv);
            
            // Activar después de un pequeño delay para la transición
            setTimeout(() => {
                spreadDiv.classList.add('active');
            }, 50);

            // Actualizar contador de páginas
            const firstPageNum = spreads[spreadIndex][0].dataset.page;
            document.getElementById('currentPage').textContent = firstPageNum;
        }

        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentSpread === 0;
            nextBtn.disabled = currentSpread === totalSpreads - 1;
        }

        function nextSpread() {
            if (currentSpread < totalSpreads - 1) {
                currentSpread++;
                renderSpread(currentSpread);
                updateNavigation();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function prevSpread() {
            if (currentSpread > 0) {
                currentSpread--;
                renderSpread(currentSpread);
                updateNavigation();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Event listeners
        document.getElementById('prevBtn').addEventListener('click', prevSpread);
        document.getElementById('nextBtn').addEventListener('click', nextSpread);

        // Navegación por teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                prevSpread();
            } else if (e.key === 'ArrowRight') {
                nextSpread();
            }
        });

        // Touch swipe support
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    nextSpread();
                } else {
                    prevSpread();
                }
            }
        }

        // Reiniciar en cambio de tamaño de ventana
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const wasDesktop = isDesktop;
                isDesktop = window.innerWidth > 1200;
                
                if (wasDesktop !== isDesktop) {
                    currentSpread = 0;
                    createSpreads();
                    renderSpread(0);
                    updateNavigation();
                }
            }, 250);
        });

        // Inicializar cuando el DOM esté listo
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
        // Manejo de carga de imágenes con skeleton loader
        function handleImageLoading() {
            const images = document.querySelectorAll('.logo-hover img');
            
            images.forEach(img => {
                // Si la imagen ya está cargada
                if (img.complete) {
                    img.classList.add('loaded');
                    img.parentElement.classList.add('loaded');
                } else {
                    // Cuando la imagen se carga
                    img.addEventListener('load', function() {
                        setTimeout(() => {
                            this.classList.add('loaded');
                            this.parentElement.classList.add('loaded');
                        }, 100);
                    });
                    
                    // Si hay error al cargar
                    img.addEventListener('error', function() {
                        this.parentElement.classList.add('loaded');
                        console.warn('Error al cargar imagen:', this.src);
                    });
                }
            });
        }
        
        // Ejecutar después de renderizar cada spread
        const originalRenderSpread = renderSpread;
        renderSpread = function(spreadIndex) {
            originalRenderSpread(spreadIndex);
            setTimeout(handleImageLoading, 100);
        };
        
        // Ejecutar al inicio
        setTimeout(handleImageLoading, 200);

        // Menú móvil del header
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        if (mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }
        function toggleMobileMenu() {
            if (mobileMenu) mobileMenu.classList.add('hidden');
        }

        // --- FONDO DINÁMICO: CANVAS DE PARTÍCULAS (de turing.html) ---
        const canvas = document.getElementById('bg-canvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            let particles = [];
            let mouse = { x: null, y: null, radius: 150 };

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                initParticles();
            }

            class Particle {
                constructor(x, y, vx, vy, size) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.size = size;
                    this.baseSize = size;
                    this.isOrange = Math.random() > 0.4;
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    if (this.isOrange) {
                        ctx.fillStyle = 'rgba(255, 107, 0, 0.85)';
                        ctx.shadowColor = 'rgba(255, 107, 0, 0.9)';
                    } else {
                        ctx.fillStyle = 'rgba(59, 130, 246, 0.75)';
                        ctx.shadowColor = 'rgba(59, 130, 246, 0.8)';
                    }
                    ctx.shadowBlur = 12;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                    if (mouse.x !== null && mouse.y !== null) {
                        let dx = this.x - mouse.x;
                        let dy = this.y - mouse.y;
                        let distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < mouse.radius) {
                            const force = (mouse.radius - distance) / mouse.radius;
                            const angle = Math.atan2(dy, dx);
                            this.x += Math.cos(angle) * force * 3;
                            this.y += Math.sin(angle) * force * 3;
                            this.size = this.baseSize * (1 + force * 1.5);
                        } else {
                            if (this.size > this.baseSize) this.size -= 0.1;
                        }
                    }
                }
            }

            function initParticles() {
                particles = [];
                const totalParticles = window.innerWidth < 768 ? 40 : 100;
                for (let i = 0; i < totalParticles; i++) {
                    const size = Math.random() * 2 + 1;
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height;
                    const vx = (Math.random() - 0.5) * 0.4;
                    const vy = (Math.random() - 0.5) * 0.4;
                    particles.push(new Particle(x, y, vx, vy, size));
                }
            }

            function connectParticles() {
                const maxDistance = window.innerWidth < 768 ? 90 : 120;
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < maxDistance) {
                            const alpha = (1 - distance / maxDistance) * 0.5;
                            ctx.strokeStyle = particles[i].isOrange
                                ? `rgba(255, 107, 0, ${alpha})`
                                : `rgba(59, 130, 246, ${alpha})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
            }

            function animateCanvas() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                connectParticles();
                requestAnimationFrame(animateCanvas);
            }

            window.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                mouse.x = e.clientX - rect.left;
                mouse.y = e.clientY - rect.top;
            });

            window.addEventListener('mouseleave', () => {
                mouse.x = null;
                mouse.y = null;
            });

            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    const rect = canvas.getBoundingClientRect();
                    mouse.x = e.touches[0].clientX - rect.left;
                    mouse.y = e.touches[0].clientY - rect.top;
                }
            });

            window.addEventListener('touchend', () => {
                mouse.x = null;
                mouse.y = null;
            });

            resizeCanvas();
            animateCanvas();
            window.addEventListener('resize', resizeCanvas);
        }
    </script>
</body>
</html>
