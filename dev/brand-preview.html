<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Brand preview - TURINGTECH</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { margin:0; background:#050C1F; color:#94A3B8; font-family:'Inter',sans-serif; padding:48px; }
    h4 { color:#64748B; font-size:12px; letter-spacing:2px; text-transform:uppercase; margin:40px 0 14px; }
    .row { display:flex; align-items:center; gap:40px; flex-wrap:wrap; }
    .lockup-v { text-align:center; }
    .lockup-v img { width:90px; filter:drop-shadow(0 4px 16px rgba(255,107,0,.35)); }
    .lockup-v .w { font-family:'Barlow',sans-serif; font-weight:800; font-size:26px; color:#fff; margin-top:10px; letter-spacing:1px; }
    .lockup-v .t { font-size:13px; color:#64748B; margin-top:2px; }
    .orange { color:#FF6B00; }
    .lockup-h { display:flex; align-items:center; gap:12px; }
    .lockup-h img { width:44px; filter:drop-shadow(0 0 12px rgba(255,107,0,.3)); }
    .lockup-h .w { font-family:'Barlow',sans-serif; font-weight:800; font-size:20px; color:#fff; line-height:1; }
    .lockup-h .t { font-size:10px; color:#64748B; }
    .swatch { display:inline-block; width:120px; }
    .mark-lg img { width:200px; }
  </style>
</head>
<body>
  <h4>Marca (icono)</h4>
  <div class="row mark-lg"><img src="/logo-turingtech-mark.svg" alt="mark"></div>

  <h4>Lockup vertical (login / registro / verificación)</h4>
  <div class="row">
    <div class="lockup-v">
      <img src="/logo-turingtech-mark.svg" alt="">
      <div class="w">TURING<span class="orange">TECH</span></div>
      <div class="t">Tu visión. <span class="orange">Nuestro código.</span></div>
    </div>
  </div>

  <h4>Lockup horizontal (navbar / sidebar)</h4>
  <div class="row">
    <div class="lockup-h">
      <img src="/logo-turingtech-mark.svg" alt="">
      <div>
        <div class="w">TURING<span class="orange">TECH</span></div>
        <div class="t">Tu visión. <span class="orange">Nuestro código.</span></div>
      </div>
    </div>
  </div>
</body>
</html>
